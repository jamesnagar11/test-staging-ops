apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: default
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports: 
        - containerPort: 80

---
apiVersion: v1
kind: Pod
metadata:
  name: httpd-Pod
  labels:
    app: httpd
spec:
  containers:
    - name: httpd
      image: httpd:latest
      ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: httpd-svc
spec:
  selector:
    app: httpd 
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 80
  type: LoadBalancer 